[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-gymnasium"
dynamic = ["version"]
description = "Mathematic function formulated as a Gymnasium environment."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Luc Coupal", email = "luc.coupal.1@ulaval.ca" }
]
keywords = [
    "motion-modeling",
    "simulation",
    "time-series",
    "chaotic-time-series",
    "deep-rl",
    "deep-reinforcement-learning",
    "research",
]
classifiers = [
    "Development Status :: 3 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
#    "trajectory-container-tools",
    "trajectory-container-tools @ git+https://github.com/norlab-ulaval/trajectory-container-tools.git",
    "numpy",
    "gymnasium",
    "omegaconf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "black",
    "flake8",
    "pytest-env",
    "pytest-rerunfailures",
    "pytest-xdist",
    "pytest-deprecate",
    #"pytest-benchmark",
    #"pytest-randomly",
]

[tool.setuptools.packages.find]
# Recommended Following a src-layout repository structure where "." is the repository root
# and "src" is the source code location.
where = [
    ".",
    "src"
]
# Recommended directory exclusion to prevent build faillure for cases where python projects
# are collocated along side ros2 projects in the same repository.
exclude = [
    #"src/ros2_packages*", # <-- uncomment and update with your ros pkg path
    "*/build",
    "*/install",
    "*/log"
]
